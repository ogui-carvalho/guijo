    <section id="evento">
        <div class="col-sm-12" id="timer">
            <div class="row">
                <script>
                    (function () {
                        const second = 1000,
                            minute = second * 60,
                            hour = minute * 60,
                            day = hour * 24;

                        //I'm adding this section so I don't have to keep updating this pen every year :-)
                        //remove this if you don't need it
                        let today = new Date(),
                            dd = String(today.getDate()).padStart(2, "0"),
                            mm = String(today.getMonth() + 1).padStart(2, "0"),
                            yyyy = today.getFullYear(),
                            nextYear = 2027,
                            dayMonth = "05/30/",
                            birthday = dayMonth + yyyy;

                        today = mm + "/" + dd + "/" + yyyy;
                        if (today > birthday) {
                            birthday = dayMonth + nextYear;
                        }
                        //end

                        const countDown = new Date(birthday).getTime(),
                            x = setInterval(function () {

                                const now = new Date().getTime(),
                                    distance = countDown - now;

                                document.getElementById("days").innerText = Math.floor(distance / (day)),
                                    document.getElementById("hours").innerText = Math.floor((distance % (day)) / (hour)),
                                    document.getElementById("minutes").innerText = Math.floor((distance % (hour)) / (minute)),
                                    document.getElementById("seconds").innerText = Math.floor((distance % (minute)) / second);

                                //do something later when date is reached
                                if (distance < 0) {
                                    document.getElementById("headline").innerText = "It's my birthday!";
                                    document.getElementById("countdown").style.display = "none";
                                    document.getElementById("content").style.display = "block";
                                    clearInterval(x);
                                }
                                //seconds
                            }, 0)
                    }());
                </script>
                <div id="countdown">
                    <h1>Está chegando!</h1>
                    <ul>
                        <li><span id="days"></span> Dias</li>
                        <li><span id="hours"></span> Horas</li>
                        <li><span id="minutes"></span> Minutos</li>
                        <li><span id="seconds"></span> Segundos</li>
                    </ul>
                </div>
            </div>

<section id="spotify-playlist">
    <div id="spotify-playlist-embed"></div>
    <script src="https://open.spotify.com/embed/iframe-api/v1" async></script>
    <script>
        // Global variable to keep track of the controller instance
        let playlistController = null;

        // 3. This exact function name is required by the Spotify script
        window.onSpotifyIframeApiReady = (IFrameAPI) => {
            const element = document.getElementById('spotify-playlist-embed');

            const options = {
                uri: 'spotify:playlist:37i9dQZEVXbMZ5PAcNTDXd', // The Spotify Playlist URI
                width: '100%',
                height: '140' // Standard height for desktop playlist embeds
            };

            // 4. Instantiate the controller factory
            IFrameAPI.createController(element, options, (EmbedController) => {
                playlistController = EmbedController;

                // Optional: Listen for events inside the iframe player
                playlistController.addListener('ready', () => {
                    console.log('The playlist player is ready!');
                });

                playlistController.addListener('playback_update', (event) => {
                    const { loading, currentPosition, duration, isPaused } = event.data;
                    console.log(`Paused: ${isPaused}, Position: ${currentPosition}/${duration}`);
                });
            });
        };
    </script>
