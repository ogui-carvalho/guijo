        <div id="timer">
<script>
(function () {
    const second = 1000,
        minute = second * 60,
        hour = minute * 60,
        day = hour * 24;

    const now = new Date();
    const currentYear = now.getFullYear();

    // Event: May 30 at 17:00 GMT-3
    let birthday = `${currentYear}-05-15T17:00:00-03:00`;
    let countDown = new Date(birthday).getTime();

    // If this year's event has already passed,
    // use May 30 of next year
    if (now.getTime() >= countDown) {
        birthday = `${currentYear + 1}-05-15T17:00:00-03:00`;
        countDown = new Date(birthday).getTime();
    }

    const x = setInterval(function () {

        const now = new Date().getTime();
        const distance = countDown - now;

        document.getElementById("days").innerText =
            Math.floor(distance / day);

        document.getElementById("hours").innerText =
            Math.floor((distance % day) / hour);

        document.getElementById("minutes").innerText =
            Math.floor((distance % hour) / minute);

        document.getElementById("seconds").innerText =
            Math.floor((distance % minute) / second);

        // Event has arrived
        if (distance < 0) {
            document.getElementById("headline").innerText =
                "It's my birthday!";

            document.getElementById("countdown").style.display = "none";
            document.getElementById("content").style.display = "block";

            clearInterval(x);
        }

    }, 1000);

})();
</script>

<section id="spotify-playlist">
    <button id="spotify-playlist-toggle" onclick="toggleSpotifyPlaylist()" class="circle">
        <div class="triangle"></div>
    </button>
    <div id="spotify-playlist-embed-container" style="display:none;">
        <div id="spotify-playlist-embed"></div>
    </div>
    <script src="https://open.spotify.com/embed/iframe-api/v1" async></script>
    <script>
        // Global variable to keep track of the controller instance
        let playlistController = null;

        // 3. This exact function name is required by the Spotify script
        window.onSpotifyIframeApiReady = (IFrameAPI) => {
            const element = document.getElementById('spotify-playlist-embed');

            const options = {
                uri: 'spotify:playlist:0dNEMHJ4lpI7Bm1gzgj3e1', // The Spotify Playlist URI
                width: '100%',
                height: '140' // Standard height for desktop playlist embeds
            };

            // 4. Instantiate the controller factory
            IFrameAPI.createController(element, options, (EmbedController) => {
                playlistController = EmbedController;

                // Optional: Listen for events inside the iframe player
                playlistController.addListener('ready', () => {
                    console.log('The playlist player is ready!');
                });

                playlistController.addListener('playback_update', (event) => {
                    const { loading, currentPosition, duration, isPaused } = event.data;
                    console.log(`Paused: ${isPaused}, Position: ${currentPosition}/${duration}`);
                });
            });
        };
        function toggleSpotifyPlaylist() {
            const container = document.getElementById('spotify-playlist-embed-container');
            document.getElementById('spotify-playlist-toggle').style.display = 'none';
            if (container.style.display === 'none') {
                container.style.display = 'block';
            } else {
                container.style.display = 'none';
            }
            if (playlistController) {
                playlistController.togglePlay(); // Alternates play/pause
            }
        }
    </script>
</section>
